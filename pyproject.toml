[project]
name = "graph-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omartt4", email = "o.yousseff78@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=20.0.0",
    "py7zr>=1.1.4",
    "pyjwt>=2.15.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "rarfile>=4.5",
    "streamlit>=1.66.1",
    "langchain>=1.5.2",
    "langchain-openrouter>=0.3.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langchain-chroma>=1.1.0",
    "langchain-neo4j>=0.5.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "spacy>=3.8.0,<4.0.0",
    "stanza>=1.15.0,<2.0.0",
    "torch==2.9.1+cpu",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
    "xx-sent-ud-sm @ https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
graph-rag = "graph_rag:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
