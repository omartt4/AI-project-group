services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8501
      PDF_DIR: pdfs
      DATA_DIR: data
      CHROMA_PERSIST_DIR: data/chroma_db
      SQLITE_DB_PATH: data/graph_rag.db
      UPLOAD_TEMP_DIR: data/temp_uploads
      EXTRACTION_CACHE_DIR: data/extraction_cache
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_FALLBACK_ENGINE: ${OCR_FALLBACK_ENGINE:-tesseract}
      PADDLE_OCR_URL: http://ocr:8000
      # Respect the target configured in .env. This can be either the local
      # Compose service (bolt://neo4j:7687) or an Aura neo4j+s:// URI.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "8501:8501"
    volumes:
      # The application loads /app/.env itself. Mount the current host file so
      # a stale copy baked into an older image can never override new Aura
      # credentials. Keep it read-only inside the container.
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./pdfs:/app/pdfs
      - paddle-models:/root/.paddlex
      - model-cache:/root/.cache
    depends_on:
      neo4j:
        condition: service_healthy
      ocr:
        condition: service_healthy
    restart: unless-stopped

  ocr:
    build:
      context: ./docker/ocr-service
      dockerfile: Dockerfile
    environment:
      PADDLE_OCR_LANGUAGE: ${PADDLE_OCR_LANGUAGE:-ar}
    ports:
      - "8001:8000"
    volumes:
      - paddle-models:/root/.paddlex
      - model-cache:/root/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      # Keep the container's standard ports, but avoid clashing with an
      # existing local Neo4j instance on the Windows host.
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" \"RETURN 1\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  paddle-models:
  model-cache:
